<text x="69" y="54" font-family="monospace" font-size="13" letter-spacing="3" fill="#a8c1c9">ASADLEE24 / BUILD LOG</text>
<text x="1145" y="54" text-anchor="end" font-family="monospace" font-size="12" letter-spacing="2" fill="#748c99">PESHAWAR, PK</text>
<text x="49" y="177" font-size="86" letter-spacing="-5" font-weight="700" fill="#f0f5f4">Asad Lee<tspan fill="#8ee9cc">.</tspan></text>
<text x="54" y="225" font-size="26" fill="#b4c6cd">Ideas into things you can use.</text>
<text x="54" y="272" font-size="17" fill="#8299a6">Web developer. Open-source contributor.</text>
<text x="54" y="301" font-size="17" fill="#8299a6">Exploring agent networks and onchain tools.</text>
<rect x="54" y="335" width="203" height="43" rx="21" fill="#8ee9cc"/>
<text x="155" y="362" text-anchor="middle" font-family="monospace" font-size="17" fill="#102923">asadlee.bond ↗</text>
