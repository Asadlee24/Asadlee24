<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t d">
<title id="t">Asad Lee — developer, builder, explorer</title><desc id="d">A midnight studio with a floating sculptural AL monogram, orbital paths and animated signal lights. Portfolio: asadlee.bond.</desc>
<defs>
<radialGradient id="bg"><stop stop-color="#243037"/><stop offset="1" stop-color="#0b1016"/></radialGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0f6f5"/><stop offset=".4" stop-color="#88a5ad"/><stop offset=".7" stop-color="#d1e3e5"/><stop offset="1" stop-color="#486976"/></linearGradient>
<linearGradient id="edge" x2="1" y2="1"><stop stop-color="#31545e"/><stop offset="1" stop-color="#15252e"/></linearGradient>
<linearGradient id="line"><stop stop-color="#8ee9cc" stop-opacity="0"/><stop offset=".5" stop-color="#8ee9cc"/><stop offset="1" stop-color="#8ee9cc" stop-opacity="0"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#7ff5cf" stop-opacity=".16"/><stop offset="1" stop-color="#7ff5cf" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#a3b7c4" stroke-opacity=".05"/></pattern>
<style>@media(prefers-reduced-motion:reduce){.float,.orbit,.pulse{animation:none}} .float{animation:float 7s ease-in-out infinite}.orbit{transform-origin:930px 238px;animation:spin 28s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.35}}</style>
</defs>
<rect width="1200" height="480" rx="20" fill="#0b1016"/>
