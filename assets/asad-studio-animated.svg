<text x="54" y="450" font-family="monospace" font-size="12" letter-spacing="2" fill="#90a5ae">CODE / EXPERIMENT / REFINE</text>
<text x="1146" y="450" text-anchor="end" font-family="monospace" font-size="12" letter-spacing="2" fill="#90a5ae">INDEPENDENT &amp; ALWAYS CURIOUS</text>
